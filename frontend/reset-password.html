<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Reset password - ApexGamer</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f1f5f9;
        font-family: Arial, Helvetica, sans-serif;
        color: #111827;
        padding: 16px;
    }
    .card {
        width: 100%;
        max-width: 400px;
        background: #fff;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 20px 60px #00000020;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    h1 span { color: #1468ff; }
    p.sub { margin: 0 0 22px; color: #64748b; }
    form { display: flex; flex-direction: column; gap: 13px; }
    input[type=password], input[type=text] {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #dbe3ef;
        border-radius: 9px;
        outline: none;
        font-size: 16px;
    }
    input:focus { border-color: #1468ff; }
    label.show { font-size: 14px; color: #64748b; display: flex; gap: 8px; align-items: center; }
    button {
        border: none;
        padding: 13px;
        border-radius: 9px;
        background: #1468ff;
        color: #fff;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    #msg { margin-top: 15px; text-align: center; font-size: 14px; }
    #msg.ok { color: #15803d; }
    #msg.err { color: #b91c1c; }
    a.home { display: none; margin-top: 16px; text-align: center; color: #1468ff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
    <h1>Reset your <span>password</span></h1>
    <p class="sub">Choose a new password for your ApexGamer account.</p>

    <form id="resetForm">
        <input id="pw1" type="password" placeholder="New password" minlength="6" autocomplete="new-password" required>
        <input id="pw2" type="password" placeholder="Confirm new password" minlength="6" autocomplete="new-password" required>
        <label class="show"><input id="showPw" type="checkbox"> Show password</label>
        <button id="submitBtn" type="submit">Update password</button>
    </form>

    <div id="msg"></div>
    <a class="home" id="homeLink" href="/">Go to ApexGamer and log in</a>
</div>

<script>
(function () {
    var params = new URLSearchParams(window.location.search);
    var token = params.get("token") || "";

    // keep the token out of the address bar / history
    if (window.history && history.replaceState) {
        history.replaceState(null, "", window.location.pathname);
    }

    var form = document.getElementById("resetForm");
    var pw1 = document.getElementById("pw1");
    var pw2 = document.getElementById("pw2");
    var msg = document.getElementById("msg");
    var btn = document.getElementById("submitBtn");
    var home = document.getElementById("homeLink");

    function show(text, cls) {
        msg.textContent = text;
        msg.className = cls || "";
    }

    if (!token) {
        form.style.display = "none";
        show("This reset link is invalid. Please request a new one from the login window.", "err");
        home.style.display = "block";
        home.textContent = "Back to ApexGamer";
        return;
    }

    document.getElementById("showPw").addEventListener("change", function (e) {
        var type = e.target.checked ? "text" : "password";
        pw1.type = type;
        pw2.type = type;
    });

    form.addEventListener("submit", async function (e) {
        e.preventDefault();

        if (pw1.value !== pw2.value) {
            show("Passwords do not match.", "err");
            return;
        }

        if (pw1.value.length < 6) {
            show("Password must be at least 6 characters.", "err");
            return;
        }

        btn.disabled = true;
        show("Updating...", "");

        try {
            var res = await fetch("/auth/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token: token, new_password: pw1.value })
            });

            var data = {};
            try { data = await res.json(); } catch (err) {}

            if (res.ok) {
                form.style.display = "none";
                show(data.message || "Password updated. You can now log in.", "ok");
                home.style.display = "block";
                return;
            }

            var detail = typeof data.detail === "string"
                ? data.detail
                : "Something went wrong. Please try again.";
            show(detail, "err");
        } catch (err) {
            show("Could not reach the server. Please try again.", "err");
        }

        btn.disabled = false;
    });
})();
</script>
</body>
</html>
